name: QA

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_MIN_COVERAGE: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Regression (analyze + unit + widget + coverage)
        run: ./scripts/qa_agent.sh regression
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            reports/
            coverage/lcov.info
      - name: Add report to job summary
        if: always()
        run: cat reports/qa_report.md >> "$GITHUB_STEP_SUMMARY" || true

  integration-android:
    # Runs on main or manual trigger only: emulators are slow.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          script: ./scripts/qa_agent.sh integration emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-integration
          path: reports/
